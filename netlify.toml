[build]
  command = "npm run build"
  publish = "dist"

# Cache agresivo para media estática (nombres no cambian salvo re-upload)
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache agresivo para assets hasheados de Astro
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache para páginas HTML (actualizadas en cada deploy)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
